<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rawdawgs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,900;1,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150e08; --card:#1f1509; --line:#3a2812; --line2:#4d3517;
  --ink:#f5ead6; --dim:#b09673; --faint:#7a6244;
  --sodium:#f08c2e; --bad:#d95e4a; --good:#9dc06a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px 52px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 380px at 50% -6%,rgba(240,140,46,.1),transparent 62%)}
header{text-align:center}
h1{font-weight:900;font-style:italic;font-size:42px;letter-spacing:1px;color:var(--sodium);transform:skewX(-4deg)}
.sub{color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:2.4px;margin-top:8px;text-transform:uppercase}
.checker{height:12px;width:min(560px,94vw);margin:18px 0 0;background:repeating-conic-gradient(#e8dcc2 0% 25%, #1c130a 0% 50%) 0 0/24px 24px;border-radius:3px}
#grill{width:min(560px,94vw);margin:16px 0 0;border:1px solid var(--line2);border-radius:16px;padding:26px 18px 30px;display:flex;gap:20px 26px;justify-content:center;flex-wrap:wrap;min-height:150px;align-items:center;position:relative;
background:
 repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.45) 30px 34px),
 linear-gradient(180deg,#8f9296 0%,#6d7074 18%,#4e5154 50%,#33363a 82%,#22252a 100%)}
#grill::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 3px 10px rgba(255,255,255,.12),inset 0 -14px 24px rgba(0,0,0,.55);pointer-events:none}
.dog{cursor:pointer;position:relative;text-align:center;transition:transform .15s;z-index:1;padding:4px 6px 14px}
.dog:hover{transform:scale(1.1) rotate(-2deg)}
.dog .t{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#e8dcc2;position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.dog .t.gold{color:#ffd98a;font-weight:600}
.dog svg{filter:drop-shadow(0 5px 5px rgba(0,0,0,.5))}
#hud{display:flex;justify-content:center;gap:0;margin:18px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);width:min(560px,94vw)}
#hud .cell{flex:1;padding:10px 8px;border-right:1px solid var(--line);text-align:center}
#hud .cell:last-child{border-right:none}
#hud .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
#hud .v{font-weight:900;font-size:20px;margin-top:2px;color:var(--sodium);font-variant-numeric:tabular-nums}
#row{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{cursor:pointer;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;padding:13px 22px;letter-spacing:1.6px;text-transform:uppercase;transition:border-color .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--sodium);transform:translateY(-1px);color:var(--sodium)}
button:disabled{opacity:.4}
#msg{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);letter-spacing:.4px;min-height:20px;text-align:center;width:min(480px,92vw);line-height:1.7}
footer{margin-top:22px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<header>
  <h1>RAWDAWGS</h1>
  <div class="sub">Gas station grill master &middot; the rollers never stop</div>
</header>
<div class="checker"></div>
<div id="grill"></div>
<div id="hud">
  <div class="cell"><div class="k">Served</div><div class="v" id="served">0</div></div>
  <div class="cell"><div class="k">Tips</div><div class="v" id="tips">$0</div></div>
  <div class="cell"><div class="k">Inspector sightings</div><div class="v" id="insp">0</div></div>
</div>
<div id="row">
  <button id="stock">Stock roller</button>
  <button id="shift">End shift</button>
</div>
<div id="msg">dogs cook on the rollers. click a golden dog to serve it. serve raw, lose tips. let them burn, the inspector circles.</div>
<footer>open 24 hours &middot; pump 4 has the good squeegee</footer>
<script>
const $=id=>document.getElementById(id);
const grill=$('grill');
let served=0,tips=0,insp=0,dogs=[],over=false;
const STAGES=[['#d9a48f','raw',0],['#cf945f','cooking',4],['#c97a2e','golden',8],['#7a4a22','overdone',13],['#241509','burnt',17]];
function dogSVG(fill,sheen){
 return '<svg width="76" height="34" viewBox="0 0 76 34" fill="none">'+
 '<path d="M10 17 C10 10 16 6 24 6 L52 6 C60 6 66 10 66 17 C66 24 60 28 52 28 L24 28 C16 28 10 24 10 17 Z" fill="'+fill+'"/>'+
 '<path d="M10 17 C10 10 16 6 24 6 L52 6 C60 6 66 10 66 17 C66 24 60 28 52 28 L24 28 C16 28 10 24 10 17 Z" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>'+
 (sheen?'<path d="M20 11 C30 8.5 46 8.5 56 11" stroke="rgba(255,240,200,.65)" stroke-width="3" stroke-linecap="round" fill="none"/>':'<path d="M20 11 C30 9 46 9 56 11" stroke="rgba(255,255,255,.22)" stroke-width="3" stroke-linecap="round" fill="none"/>')+
 '<circle cx="10" cy="17" r="2.4" fill="rgba(0,0,0,.28)"/><circle cx="66" cy="17" r="2.4" fill="rgba(0,0,0,.28)"/></svg>';
}
function stock(){
  if(over)return;
  if(dogs.length>=6){$('msg').textContent='the rollers are full. physics and health codes agree.';return;}
  const el=document.createElement('div');el.className='dog';
  const d={el,t:0};
  el.onclick=()=>serve(d);
  grill.appendChild(el);dogs.push(d);renderDog(d);
}
function renderDog(d){
  let s=STAGES[0];
  if(d.t>=17)s=STAGES[4];else if(d.t>=13)s=STAGES[3];else if(d.t>=8)s=STAGES[2];else if(d.t>=4)s=STAGES[1];
  d.el.innerHTML=dogSVG(s[0],s[1]==='golden')+'<div class="t'+(s[1]==='golden'?' gold':'')+'">'+s[1].toUpperCase()+'</div>';
}
function serve(d){
  if(over)return;
  let tip=0,note='';
  if(d.t<4){tip=-2;note='you served it RAW. the customer ascends to a higher plane of confusion. -$2';}
  else if(d.t<8){tip=1;note='a bit under. the customer shrugs. +$1';}
  else if(d.t<13){tip=5;served++;note='GOLDEN. snapped casing, perfect sheen. +$5 tip.';}
  else if(d.t<17){tip=2;served++;note='overdone but honest. +$2';}
  else{tip=0;note='burnt beyond the law. tossed to the parking lot crows.';}
  tips=Math.max(0,tips+tip);
  $('served').textContent=served;$('tips').textContent='$'+tips;
  $('msg').textContent=note;
  d.el.remove();dogs=dogs.filter(x=>x!==d);
}
setInterval(()=>{
  if(over)return;
  dogs.forEach(d=>{d.t+=.5;renderDog(d);});
  const burnt=dogs.filter(d=>d.t>=17).length;
  if(burnt>=3){insp++;$('insp').textContent=insp;dogs=dogs.filter(d=>d.t<17);renderAll();$('msg').textContent='HEALTH INSPECTOR SIGHTING #'+insp+'. The grill is wiped. The dogs are gone. The crows testify against you.';}
  if(insp>=3){over=true;$('msg').textContent='SHUT DOWN. Final tally: '+served+' served, $'+tips+' tips. The rollers stop for the first time in a decade.';}
},500);
function renderAll(){grill.innerHTML='';dogs.forEach(d=>{grill.appendChild(d.el);renderDog(d);});}
$('stock').onclick=stock;
$('shift').onclick=()=>{if(!over){over=true;$('msg').textContent='SHIFT OVER. '+served+' dawgs served, $'+tips+' in tips, '+insp+' inspector sightings. The rollers await your return.';}};
stock();stock();stock();
</script>
</body>
</html>
